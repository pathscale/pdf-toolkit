[package]
name = "pdf-toolkit-core"
description = "Zero-copy, bounded, no_std PDF reader core: objects, xref tables and streams, filters, page tree"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
std = []

[dependencies]
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
chacha20poly1305 = { version = "^0.11", default-features = false, features = ["alloc"] }
argon2 = { version = "^0.6", default-features = false, features = ["alloc"] }
