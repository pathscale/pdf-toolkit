[package]
name = "pdf-toolkit-apps"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "pdf-roundtrip"
path = "../pdf-edit/src/bin/pdf-roundtrip.rs"

[[bin]]
name = "pdf-sign-fixtures"
path = "../pdf-edit/src/bin/pdf-sign-fixtures.rs"
required-features = ["sign"]

[[bin]]
name = "pdf-fixtures"
path = "../pdf-write/src/bin/pdf-fixtures.rs"

[features]
default = ["sign"]
sign = ["pdf-toolkit-edit/sign", "dep:sha2", "dep:cms", "dep:der"]

[dependencies]
pdf-core = { package = "pdf-toolkit-core", version = "^0.3.9", path = "../pdf-core", features = ["std"] }
pdf-write = { package = "pdf-toolkit-write", version = "^0.3.9", path = "../pdf-write" }
pdf-text = { package = "pdf-toolkit-text", version = "^0.3.9", path = "../pdf-text" }
pdf-raster = { package = "pdf-toolkit-raster", version = "^0.3.9", path = "../pdf-raster" }
pdf-render = { package = "pdf-toolkit-render", version = "^0.3.9", path = "../pdf-render" }
pdf-toolkit-edit = { version = "^0.3.9", path = "../pdf-edit", default-features = false }
libc = "^0.2.189"
nagoya = { version = "^0.1.12", path = "../../nagoya" }
sha2 = { version = "^0.11", default-features = false, optional = true }
cms = { version = "^0.3.0-pre.2", default-features = false, optional = true }
der = { version = "^0.8", default-features = false, features = ["alloc", "oid"], optional = true }
