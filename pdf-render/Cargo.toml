[package]
name = "pdf-toolkit-render"
description = "PDF page display lists with glyph outlines from TrueType, CFF and Type 1 fonts (no_std)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
pdf-core = { package = "pdf-toolkit-core", version = "0.3.1", path = "../pdf-core", default-features = false }
pdf-text = { package = "pdf-toolkit-text", version = "0.3.1", path = "../pdf-text", default-features = false }
skrifa = { version = "0.42", default-features = false, features = ["libm"] }
