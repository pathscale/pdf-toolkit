[package]
name = "pdf-toolkit-text"
description = "PDF fonts, encodings, ToUnicode CMaps, content interpreter, reading order and semantic documents (no_std)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
std = ["pdf-core/std", "jxl-oxide?/std"]
jpx = ["dep:hayro-jpeg2000"]
jxl = ["dep:jxl-oxide"]

[dependencies]
pdf-core = { package = "pdf-toolkit-core", version = "0.3.12", path = "../pdf-core", default-features = false }
read-fonts = { version = "0.39.2", default-features = false, features = ["libm"] }
hayro-jpeg2000 = { package = "ps-hayro-jpeg2000", version = "0.5.0", default-features = false, optional = true }
jxl-oxide = { package = "ps-jxl-oxide", version = "0.13.0", default-features = false, optional = true }

