[package]
name = "pdf-toolkit-text"
description = "PDF fonts, encodings, ToUnicode CMaps, content interpreter, reading order and semantic documents (no_std)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
std = ["pdf-core/std"]
jpx = ["dep:hayro-jpeg2000"]

[dependencies]
pdf-core = { package = "pdf-toolkit-core", version = "0.1.0", path = "../pdf-core", default-features = false }
hayro-jpeg2000 = { version = "0.4.1", default-features = false, optional = true }
