[package]
name = "pdf-toolkit-edit"
description = "Incremental PDF updates that keep the original bytes, plus a writer and editor round-trip checker"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["sign"]
# ECDSA P-256 and P-384 signing and verification (`pdf_edit::sign`).
sign = ["dep:p256", "dep:p384", "dep:sha2", "dep:cms", "dep:x509-cert", "dep:der"]



[[bin]]
name = "pdf-sign-fixtures"
required-features = ["sign"]

[dependencies]
pdf-core = { package = "pdf-toolkit-core", version = "0.3.9", path = "../pdf-core", default-features = false, features = ["std"] }
pdf-write = { package = "pdf-toolkit-write", version = "0.3.9", path = "../pdf-write" }
pdf-text = { package = "pdf-toolkit-text", version = "0.3.9", path = "../pdf-text" }
pdf-raster = { package = "pdf-toolkit-raster", version = "0.3.9", path = "../pdf-raster" }
pdf-render = { package = "pdf-toolkit-render", version = "0.3.9", path = "../pdf-render" }
p256 = { version = "^0.14", default-features = false, features = ["ecdsa"], optional = true }
p384 = { version = "^0.14", default-features = false, features = ["ecdsa"], optional = true }
sha2 = { version = "^0.11", default-features = false, optional = true }
cms = { version = "^0.3.0-pre.2", default-features = false, optional = true }
x509-cert = { version = "^0.3", default-features = false, optional = true }
der = { version = "^0.8", default-features = false, features = ["alloc", "oid"], optional = true }
