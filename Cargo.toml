[workspace]
resolver = "2"
members = [
    "pdf-core",
    "pdf-text",
    "pdf-render",
    "pdf-raster",
    "pdf-inspect",
    "pdf-write",
    "pdf-edit",
    "pdf-toolkit",
]

[workspace.package]
version = "0.3.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/pathscale/pdf-toolkit"
homepage = "https://github.com/pathscale/pdf-toolkit"
readme = "README.md"
keywords = ["pdf", "parser", "text-extraction", "renderer", "no-std"]
categories = ["parser-implementations", "rendering", "text-processing", "no-std"]
