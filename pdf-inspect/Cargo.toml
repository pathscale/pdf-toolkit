[package]
name = "pdf-toolkit-inspect"
description = "pdf-inspect: summary, text, receipts, semantic JSON, rendering, benchmarks, fuzzing and fixture checks for PDFs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "pdf-inspect"
path = "src/main.rs"

[dependencies]
nagoya = { version = "^0.1.12", path = "../../nagoya", features = ["reactor"] }
libc = "^0.2.189"
rusty_alloc = { package = "ps-rusty_alloc", version = "^2.3.3" }
pdf-core = { package = "pdf-toolkit-core", version = "0.3.9", path = "../pdf-core", default-features = false, features = ["std"] }
pdf-text = { package = "pdf-toolkit-text", version = "0.3.9", path = "../pdf-text", features = ["jpx", "jxl"] }
pdf-raster = { package = "pdf-toolkit-raster", version = "0.3.9", path = "../pdf-raster" }
pdf-render = { package = "pdf-toolkit-render", version = "0.3.9", path = "../pdf-render", default-features = false }
pdf-edit = { package = "pdf-toolkit-edit", version = "0.3.9", path = "../pdf-edit" }
